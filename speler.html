<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
<meta name="mobile-web-app-capable" content="yes">
<title>Ankie op Kamp – Spelersscherm</title>
<link rel="manifest" href="/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.1.3/dist/maplibre-gl.css">
<link rel="stylesheet" href="/css/speler.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.1.3/dist/maplibre-gl.js"></script>
<script src="/js/sync.js"></script>
</head>
<body>

<!-- ── START SCHERM ── -->
<div id="start-screen">
  <div class="start-inner">
    <div class="start-logo">🗺️</div>
    <h1>Ankie op Kamp</h1>
    <p>Kaartlezen als vroeger</p>
    <button id="btn-start-rit" class="btn-start">▶ Start de rit</button>
    <p class="start-hint">Tik om de app te starten en audio te activeren</p>
  </div>
</div>

<!-- ── HOOFD APP ── -->
<div id="app" style="display:none; position:fixed; inset:0;">

  <!-- Kaart -->
  <div id="map" style="position:absolute;inset:0;"></div>

  <!-- Navigatie instructie banner (bovenaan, bij terugkeer) -->
  <div id="nav-banner">
    <div id="nav-stap">
      <div id="nav-pijl">↑</div>
      <div id="nav-tekst">Rijd rechtdoor</div>
      <div id="nav-afstand">–</div>
    </div>
    <div id="nav-totaal">
      <span id="nav-totaal-afstand">–</span>
      <span id="nav-totaal-tijd">–</span>
    </div>
  </div>

  <!-- Van route af: melding -->
  <div id="route-alert" class="route-alert hidden">
    <span class="alert-icon">⚠️</span>
    <span class="alert-text">Jullie zijn van de route af</span>
    <span class="alert-sub">Route terug wordt berekend…</span>
  </div>

  <!-- Opdracht overlay -->
  <div id="opdracht-overlay" class="opdracht-overlay hidden">
    <div class="opdracht-card">
      <div class="opdracht-header">
        <span class="opdracht-icon">📋</span>
        <h2 id="opdracht-titel">Opdracht</h2>
      </div>
      <div id="opdracht-afbeelding-wrap" class="hidden">
        <img id="opdracht-afbeelding" src="" alt="Opdracht afbeelding">
      </div>
      <p id="opdracht-tekst"></p>
      <div id="opdracht-timer" class="opdracht-timer hidden">
        <span class="timer-label">Tijd:</span>
        <span id="timer-display" class="timer-value">00:00</span>
      </div>
      <button id="btn-opdracht-klaar" class="btn-klaar">✓ Voltooid!</button>
    </div>
  </div>

  <!-- Opdrachten geschiedenis knop -->
  <button id="btn-geschiedenis">
    📋 Opdrachten
    <span id="geschiedenis-badge">0</span>
  </button>

  <!-- Opdrachten geschiedenis panel (slide up) -->
  <div id="geschiedenis-panel">
    <div class="panel-handle">
      <h3>📋 Ontvangen opdrachten</h3>
      <button class="panel-close" id="btn-sluit-geschiedenis">✕</button>
    </div>
    <div id="geschiedenis-lijst">
      <p class="geen-opdrachten">Nog geen opdrachten ontvangen.</p>
    </div>
  </div>

  <!-- Status bar -->
  <div id="status-bar">
    <span id="gps-indicator" class="gps-dot gps-searching"></span>
    <span id="gps-label">GPS zoeken…</span>
    <span class="status-sep">|</span>
    <span id="sync-label">Verbinden…</span>
  </div>

  <audio id="audio-player" preload="auto"></audio>
</div>

<script>
'use strict';

var map = null;
var audioUnlocked = false;
var audioPlayer = document.getElementById('audio-player');
var currentPos = null;
var activeRoute = { coords: [], id: null, steps: [] };
var offRouteStart = null;
var isOffRoute = false;
var settings = {};
var activeOpdracht = null;
var completedIds = {};
var pendingOpdrachten = [];
var ontvangen = [];          // opdrachten geschiedenis
var audioCache = {};
var playerVisibleTimer = null;
var playerVisible = false;
var startMarker = null;
var navStappen = [];         // OSRM turn-by-turn stappen
var huidigStapIdx = 0;

// ─── START KNOP ──────────────────────────────────────
document.getElementById('btn-start-rit').addEventListener('click', function() {
  try {
    audioPlayer.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
    audioPlayer.play().catch(function(){});
    audioUnlocked = true;
  } catch(e) {}
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  initApp();
});

// ─── GESCHIEDENIS PANEL ───────────────────────────────
document.getElementById('btn-geschiedenis').addEventListener('click', function() {
  document.getElementById('geschiedenis-panel').classList.add('open');
});
document.getElementById('btn-sluit-geschiedenis').addEventListener('click', function() {
  document.getElementById('geschiedenis-panel').classList.remove('open');
});

// ─── INIT ─────────────────────────────────────────────
async function initApp() {
  loadSettings();
  SettingsStore.load().then(function() { loadSettings(); }).catch(function(){});
  initMap();
  startGPS();
  loadActiveRoute().catch(function(e){ console.warn('route laden:', e); });
  loadPendingOpdrachten().catch(function(e){ console.warn('opdrachten laden:', e); });
  loadAudioCatalog().catch(function(e){});
  SignalBus.startPolling(2500);
  bindSignals();
  requestWakeLock();
  setInterval(syncLoop, 6000);
  document.getElementById('sync-label').textContent = 'Verbonden';
}

function loadSettings() {
  settings = {
    afwijkingDrempel:     SettingsStore.get('afwijking_drempel', 500),
    wachttijd:            SettingsStore.get('wachttijd', 30),
    locatieZichtbaarDuur: SettingsStore.get('locatie_zichtbaar_duur', 60),
    toonRoute:            SettingsStore.get('toon_route', true),
    toonBestemming:       SettingsStore.get('toon_bestemming', false),
    terughaalActief:      SettingsStore.get('terughaal_actief', true),
    kaartstijl:           SettingsStore.get('kaartstijl', 'https://tiles.openfreemap.org/styles/liberty'),
    routeZichtbaarVanaf:  SettingsStore.get('route_zichtbaar_vanaf', 'direct'),
  };
}

// ─── KAART ────────────────────────────────────────────
function initMap() {
  try {
    map = new maplibregl.Map({
      container: 'map',
      style: settings.kaartstijl,
      center: [5.2913, 52.1326],
      zoom: 9,
      attributionControl: false,
    });
    map.once('load', function() {
      map.resize();
      hidePOILayers();
      addSpelerLayers();
      if (activeRoute.coords.length) drawRoute();
    });
    setTimeout(function() { if (map) map.resize(); }, 200);
    setTimeout(function() { if (map) map.resize(); }, 800);
    map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
  } catch(e) {
    console.error('Kaart init fout:', e);
    document.getElementById('sync-label').textContent = 'Kaart fout: ' + e.message;
  }
}

function hidePOILayers() {
  if (!map || !map.getStyle()) return;
  var poiPatterns = ['poi','shop','restaurant','cafe','hotel','amenity','worship','transit','airport','station','parking'];
  try {
    (map.getStyle().layers || []).forEach(function(layer) {
      if (layer.type !== 'symbol') return;
      var lid = layer.id.toLowerCase();
      if (lid.includes('place')||lid.includes('road')||lid.includes('street')||
          lid.includes('highway')||lid.includes('city')||lid.includes('town')||
          lid.includes('village')||lid.includes('country')||lid.includes('water')||
          lid.includes('label')||lid.includes('name')||lid.includes('state')) return;
      if (poiPatterns.some(function(k){ return lid.includes(k); })) {
        try { map.setLayoutProperty(layer.id, 'visibility', 'none'); } catch(e){}
      }
    });
  } catch(e) {}
}

function addSpelerLayers() {
  try {
    // Originele route — altijd blauw zichtbaar
    map.addSource('speler-route', { type: 'geojson', data: emptyLine() });
    map.addLayer({ id: 'speler-route-bg', type: 'line', source: 'speler-route',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#1d4ed8', 'line-width': 9, 'line-opacity': 0.25 } });
    map.addLayer({ id: 'speler-route-line', type: 'line', source: 'speler-route',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#3b82f6', 'line-width': 5, 'line-opacity': 0 } });

    // Terugkeer route — rood
    map.addSource('return-route', { type: 'geojson', data: emptyLine() });
    map.addLayer({ id: 'return-route-bg', type: 'line', source: 'return-route',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#991b1b', 'line-width': 9, 'line-opacity': 0.3 } });
    map.addLayer({ id: 'return-route-line', type: 'line', source: 'return-route',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#ef4444', 'line-width': 5, 'line-opacity': 0 } });

    // Spelersdot (eigen positie)
    map.addSource('player-pos', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'Point', coordinates: [0,0] } } });
    map.addLayer({ id: 'player-dot', type: 'circle', source: 'player-pos',
      paint: { 'circle-radius': 10, 'circle-color': '#3b82f6',
               'circle-stroke-width': 3, 'circle-stroke-color': '#fff',
               'circle-opacity': 0, 'circle-stroke-opacity': 0 } });

    // Startlocatie marker
    map.addSource('start-pos', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'Point', coordinates: [0,0] } } });
    map.addLayer({ id: 'start-dot', type: 'circle', source: 'start-pos',
      paint: { 'circle-radius': 10, 'circle-color': '#22c55e',
               'circle-stroke-width': 3, 'circle-stroke-color': '#fff', 'circle-opacity': 0 } });
    map.addLayer({ id: 'start-label', type: 'symbol', source: 'start-pos',
      layout: { 'text-field': 'Start', 'text-font': ['Noto Sans Bold','Open Sans Bold'], 'text-size': 13, 'text-offset': [0, 1.6], 'text-anchor': 'top' },
      paint: { 'text-color': '#22c55e', 'text-halo-color': '#fff', 'text-halo-width': 2, 'text-opacity': 0 } });

  } catch(e) { console.warn('Speler layers fout:', e); }
}

function emptyLine() {
  return { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } };
}

// ─── GPS ──────────────────────────────────────────────
function startGPS() {
  if (!navigator.geolocation) {
    document.getElementById('gps-label').textContent = 'Geen GPS beschikbaar';
    return;
  }
  navigator.geolocation.watchPosition(onGPS, onGPSError, {
    enableHighAccuracy: true, maximumAge: 0, timeout: 15000,
  });
}

function onGPS(pos) {
  var lat = pos.coords.latitude;
  var lon = pos.coords.longitude;
  var acc = pos.coords.accuracy;
  var spd = pos.coords.speed;
  var hdg = pos.coords.heading;

  var dot = document.getElementById('gps-indicator');
  if (acc < 30)       dot.className = 'gps-dot gps-good';
  else if (acc < 100) dot.className = 'gps-dot gps-ok';
  else                dot.className = 'gps-dot gps-weak';
  document.getElementById('gps-label').textContent = 'GPS ±' + Math.round(acc) + 'm';

  PositieStore.push(lat, lon, acc, spd, hdg);

  // Eerste positie: toon dot en centreer
  if (!currentPos) {
    map.flyTo({ center: [lon, lat], zoom: 14 });
    // Zet speler zichtbaar
    try {
      map.setPaintProperty('player-dot', 'circle-opacity', 1);
      map.setPaintProperty('player-dot', 'circle-stroke-opacity', 1);
    } catch(e){}
  }
  currentPos = { lat: lat, lon: lon, accuracy: acc, speed: spd, heading: hdg };

  if (map && map.getSource('player-pos')) {
    try { map.getSource('player-pos').setData({ type: 'Feature', geometry: { type: 'Point', coordinates: [lon, lat] } }); } catch(e){}
  }

  // Route check
  if (settings.terughaalActief && activeRoute.coords && activeRoute.coords.length > 1) {
    checkRouteDeviation(lat, lon);
  }

  // Navigatie stap updaten
  if (isOffRoute && navStappen.length) {
    updateNavStap(lat, lon);
  }

  checkLocationOpdrachten(lat, lon);
}

function onGPSError(err) {
  document.getElementById('gps-indicator').className = 'gps-dot gps-error';
  var msgs = { 1: 'GPS geweigerd', 2: 'GPS niet beschikbaar', 3: 'GPS timeout' };
  document.getElementById('gps-label').textContent = msgs[err.code] || 'GPS fout';
}

// ─── ROUTE AFWIJKING ──────────────────────────────────
function checkRouteDeviation(lat, lon) {
  var dist = distanceToRoute(lat, lon, activeRoute.coords);
  var drempel = settings.afwijkingDrempel || 500;
  var wachttijdMs = (settings.wachttijd || 30) * 1000;

  if (dist > drempel) {
    if (!offRouteStart) offRouteStart = Date.now();
    if (!isOffRoute && (Date.now() - offRouteStart) >= wachttijdMs) triggerOffRoute(lat, lon);
  } else {
    if (isOffRoute) {
      if (dist < drempel * 0.65) clearOffRoute();
    } else {
      offRouteStart = null;
    }
  }
}

async function triggerOffRoute(lat, lon) {
  isOffRoute = true;
  document.getElementById('route-alert').classList.remove('hidden');
  SignalBus.send('van_route_af', { lat: lat, lon: lon, timestamp: Date.now() });

  try {
    var closest = closestRoutePoint(lat, lon, activeRoute.coords);
    var route = await osrmRoute([
      { lat: lat, lon: lon },
      { lat: closest[1], lon: closest[0] }
    ]);

    // Toon rode terugkeerroute
    if (map && map.getSource('return-route')) {
      map.getSource('return-route').setData({ type: 'Feature', geometry: route.geometry });
      map.setPaintProperty('return-route-line', 'line-opacity', 0.9);
      map.setPaintProperty('return-route-bg', 'line-opacity', 0.3);
    }

    // Sla navigatie stappen op
    navStappen = (route.legs && route.legs[0] && route.legs[0].steps) ? route.legs[0].steps : [];
    huidigStapIdx = 0;

    // Totalen
    var totalM = route.distance || 0;
    var totalS = route.duration || 0;
    document.getElementById('nav-totaal-afstand').textContent = formatAfstand(totalM) + ' terug naar route';
    document.getElementById('nav-totaal-tijd').textContent = '~' + formatTijd(totalS);

    // Toon banner
    document.getElementById('nav-banner').classList.add('actief');
    updateNavStap(lat, lon);

    // Alert sub-tekst
    document.querySelector('.route-alert .alert-sub').textContent = 'Volg de rode route terug';

  } catch(e) {
    console.warn('Terugkeer route fout:', e);
    document.querySelector('.route-alert .alert-sub').textContent = 'Geen route beschikbaar';
  }
}

function clearOffRoute() {
  isOffRoute = false;
  offRouteStart = null;
  navStappen = [];
  huidigStapIdx = 0;
  document.getElementById('route-alert').classList.add('hidden');
  document.getElementById('nav-banner').classList.remove('actief');
  try {
    if (map && map.getSource('return-route')) {
      map.getSource('return-route').setData(emptyLine());
      map.setPaintProperty('return-route-line', 'line-opacity', 0);
      map.setPaintProperty('return-route-bg', 'line-opacity', 0);
    }
  } catch(e){}
  SignalBus.send('terug_op_route', { timestamp: Date.now() });
}

function closestRoutePoint(lat, lon, coords) {
  var best = coords[0], bestD = Infinity;
  coords.forEach(function(c) {
    var d = haversineM(lat, lon, c[1], c[0]);
    if (d < bestD) { bestD = d; best = c; }
  });
  return best;
}

// ─── NAVIGATIE INSTRUCTIES ────────────────────────────
// OSRM modifier → emoji + Nederlandse tekst
function stapInfo(stap) {
  if (!stap) return { pijl: '↑', tekst: 'Rijd rechtdoor' };
  var m = (stap.maneuver && stap.maneuver.modifier) ? stap.maneuver.modifier : '';
  var t = (stap.maneuver && stap.maneuver.type) ? stap.maneuver.type : '';
  var naam = stap.name || '';

  var map_tekst = {
    'turn left':          { pijl: '↰', tekst: 'Sla linksaf' },
    'turn right':         { pijl: '↱', tekst: 'Sla rechtsaf' },
    'turn sharp left':    { pijl: '↺', tekst: 'Scherp linksaf' },
    'turn sharp right':   { pijl: '↻', tekst: 'Scherp rechtsaf' },
    'turn slight left':   { pijl: '↖', tekst: 'Licht linksaf' },
    'turn slight right':  { pijl: '↗', tekst: 'Licht rechtsaf' },
    'continue straight':  { pijl: '↑', tekst: 'Ga rechtdoor' },
    'arrive':             { pijl: '🏁', tekst: 'Je bent terug op de route' },
  };

  // Type checks
  if (t === 'arrive')          return { pijl: '🏁', tekst: 'Je bent terug op de route!' };
  if (t === 'depart')          return { pijl: '▶',  tekst: 'Vertrek' + (naam ? ' via ' + naam : '') };
  if (t === 'roundabout' || t === 'rotary') {
    var exit = stap.maneuver.exit || '?';
    return { pijl: '🔄', tekst: 'Neem afslag ' + exit + ' op de rotonde' };
  }

  var sleutel = t + ' ' + m;
  var info = map_tekst[sleutel] || map_tekst['turn ' + m];
  if (!info) info = { pijl: '↑', tekst: 'Rijd rechtdoor' };
  if (naam) info.tekst += ' — ' + naam;
  return info;
}

function updateNavStap(lat, lon) {
  if (!navStappen.length) return;

  // Zoek dichtstbijzijnde stap op basis van positie
  var stap = navStappen[huidigStapIdx];
  if (!stap) return;

  // Afstand tot einde van huidige stap
  var stapCoords = (stap.geometry && stap.geometry.coordinates) ? stap.geometry.coordinates : [];
  var eindPunt = stapCoords.length ? stapCoords[stapCoords.length - 1] : null;
  var afstandTotEinde = eindPunt ? haversineM(lat, lon, eindPunt[1], eindPunt[0]) : stap.distance;

  // Spring naar volgende stap als we dicht genoeg zijn
  if (afstandTotEinde < 30 && huidigStapIdx < navStappen.length - 1) {
    huidigStapIdx++;
    stap = navStappen[huidigStapIdx];
    afstandTotEinde = stap ? stap.distance : 0;
  }

  var info = stapInfo(stap);
  document.getElementById('nav-pijl').textContent = info.pijl;
  document.getElementById('nav-tekst').textContent = info.tekst;
  document.getElementById('nav-afstand').textContent = formatAfstand(afstandTotEinde);
}

function formatAfstand(m) {
  if (m < 1000) return Math.round(m) + ' m';
  return (m / 1000).toFixed(1) + ' km';
}

function formatTijd(s) {
  if (s < 60) return Math.round(s) + ' sec';
  var min = Math.round(s / 60);
  if (min < 60) return min + ' min';
  return Math.floor(min/60) + 'u ' + (min%60) + 'min';
}

// ─── ROUTE TEKENEN ────────────────────────────────────
function setPlayerVisible(visible) {
  playerVisible = visible;
  var o = visible ? 1 : 0;
  if (map) {
    try { map.setPaintProperty('player-dot', 'circle-opacity', o); } catch(e){}
    try { map.setPaintProperty('player-dot', 'circle-stroke-opacity', o); } catch(e){}
  }
  if (visible && settings.locatieZichtbaarDuur > 0) {
    clearTimeout(playerVisibleTimer);
    playerVisibleTimer = setTimeout(function() {
      if (!isOffRoute) setPlayerVisible(false);
    }, settings.locatieZichtbaarDuur * 1000);
  }
}

async function loadActiveRoute() {
  var r = await API.get('aok_routes', 'limit=20');
  var routes = (r.data || []);
  var actief = routes.find(function(x) { return x.actief; }) || routes[routes.length - 1];
  if (!actief) return;
  activeRoute.id = actief.id;
  activeRoute.coords = [];
  if (actief.geojson) {
    try {
      var geo = JSON.parse(actief.geojson);
      activeRoute.coords = geo.coordinates || [];
    } catch(e) {}
  }
  // Sla startcoördinaat op voor marker
  if (actief.waypoints) {
    try {
      var wps = JSON.parse(actief.waypoints);
      if (wps && wps.length) {
        var start = wps[0];
        toonStartMarker(start.lat, start.lon);
      }
    } catch(e) {}
  } else if (activeRoute.coords.length) {
    var c = activeRoute.coords[0];
    toonStartMarker(c[1], c[0]);
  }
  drawRoute();
}

function toonStartMarker(lat, lon) {
  if (!map || !map.getSource('start-pos')) return;
  try {
    map.getSource('start-pos').setData({ type: 'Feature', geometry: { type: 'Point', coordinates: [lon, lat] } });
    map.setPaintProperty('start-dot', 'circle-opacity', 1);
    map.setPaintProperty('start-label', 'text-opacity', 1);
  } catch(e){}
}

function drawRoute() {
  if (!map || !map.getSource('speler-route')) return;
  try {
    map.getSource('speler-route').setData({
      type: 'Feature',
      geometry: { type: 'LineString', coordinates: activeRoute.coords }
    });
    // Route is altijd zichtbaar (blauw)
    var opacity = (settings.toonRoute || settings.routeZichtbaarVanaf === 'direct') ? 0.85 : 0;
    map.setPaintProperty('speler-route-line', 'line-opacity', opacity);
    map.setPaintProperty('speler-route-bg', 'line-opacity', opacity > 0 ? 0.25 : 0);
  } catch(e){}
}

// ─── OPDRACHTEN ───────────────────────────────────────
async function loadPendingOpdrachten() {
  var r = await API.get('aok_opdrachten', 'limit=100');
  pendingOpdrachten = (r.data || []).filter(function(o) { return o.status !== 'voltooid'; });
  pendingOpdrachten.filter(function(o) { return o.type === 'tijd'; }).forEach(scheduleTijdOpdracht);
}

function scheduleTijdOpdracht(opdracht) {
  if (opdracht.trigger_minuten > 0) {
    setTimeout(function() { showOpdracht(opdracht); }, opdracht.trigger_minuten * 60000);
  } else if (opdracht.trigger_tijd) {
    var now = new Date();
    var parts = opdracht.trigger_tijd.split(':');
    var target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), parseInt(parts[0]), parseInt(parts[1]), 0);
    var diff = target - now;
    if (diff > 0) setTimeout(function() { showOpdracht(opdracht); }, diff);
    else if (diff > -300000) showOpdracht(opdracht);
  }
}

function checkLocationOpdrachten(lat, lon) {
  pendingOpdrachten.forEach(function(o) {
    if (o.type !== 'locatie' || completedIds[o.id] || !o.lat || !o.lon) return;
    var dist = haversineM(lat, lon, o.lat, o.lon);
    if (dist <= (o.straal || 200)) showOpdracht(o);
  });
}

function showOpdracht(opdracht) {
  if (completedIds[opdracht.id]) return;
  if (activeOpdracht && activeOpdracht.id === opdracht.id) return;
  activeOpdracht = opdracht;

  document.getElementById('opdracht-titel').textContent = opdracht.titel || 'Nieuwe opdracht';
  document.getElementById('opdracht-tekst').textContent = opdracht.tekst || '';
  var imgWrap = document.getElementById('opdracht-afbeelding-wrap');
  if (opdracht.afbeelding_url) {
    document.getElementById('opdracht-afbeelding').src = opdracht.afbeelding_url;
    imgWrap.classList.remove('hidden');
  } else { imgWrap.classList.add('hidden'); }
  document.getElementById('opdracht-timer').classList.add('hidden');
  if (opdracht.audio_id) playAudioById(opdracht.audio_id);
  document.getElementById('opdracht-overlay').classList.remove('hidden');
  SignalBus.send('opdracht_gezien', { id: opdracht.id, timestamp: Date.now() });

  // Voeg toe aan geschiedenis (als nog niet aanwezig)
  if (!ontvangen.find(function(o) { return o.id === opdracht.id; })) {
    ontvangen.push({ id: opdracht.id, titel: opdracht.titel, tekst: opdracht.tekst, status: 'ontvangen' });
    updateGeschiedenisBadge();
    renderGeschiedenisList();
  }
}

document.getElementById('btn-opdracht-klaar').addEventListener('click', async function() {
  if (!activeOpdracht) return;
  completedIds[activeOpdracht.id] = true;

  // Update status in geschiedenis
  var gevonden = ontvangen.find(function(o) { return o.id === activeOpdracht.id; });
  if (gevonden) gevonden.status = 'voltooid';
  renderGeschiedenisList();

  try { await API.patch('aok_opdrachten', activeOpdracht.id, { status: 'voltooid' }); } catch(e){}
  SignalBus.send('opdracht_voltooid', { id: activeOpdracht.id, timestamp: Date.now() });
  activeOpdracht = null;
  document.getElementById('opdracht-overlay').classList.add('hidden');
});

function updateGeschiedenisBadge() {
  document.getElementById('geschiedenis-badge').textContent = ontvangen.length;
}

function renderGeschiedenisList() {
  var lijst = document.getElementById('geschiedenis-lijst');
  if (!ontvangen.length) {
    lijst.innerHTML = '<p class="geen-opdrachten">Nog geen opdrachten ontvangen.</p>';
    return;
  }
  lijst.innerHTML = ontvangen.map(function(o) {
    var voltooid = o.status === 'voltooid';
    return '<div class="gesch-item ' + (voltooid ? 'voltooid' : '') + '">' +
      '<div class="gesch-titel">' + (voltooid ? '✅' : '📋') + ' ' + escHtml(o.titel || '—') + '</div>' +
      (o.tekst ? '<div class="gesch-tekst">' + escHtml(o.tekst) + '</div>' : '') +
      '<div class="gesch-status ' + (voltooid ? 'voltooid' : 'ontvangen') + '">' +
        (voltooid ? '✓ Voltooid' : '● Ontvangen') +
      '</div></div>';
  }).join('');
}

// ─── AUDIO ────────────────────────────────────────────
async function loadAudioCatalog() {
  var r = await API.get('aok_audio', 'limit=100');
  (r.data || []).forEach(function(a) { audioCache[a.id] = a; });
}
function playAudioById(id) {
  var a = audioCache[id];
  if (a && a.url) playAudioUrl(a.url);
}
function playAudioUrl(url) {
  if (!audioUnlocked) return;
  try {
    audioPlayer.src = url;
    audioPlayer.play().catch(function(){});
  } catch(e){}
}

// ─── SIGNALEN VAN REGIE ───────────────────────────────
function bindSignals() {
  SignalBus.on('toon_locatie', function() { setPlayerVisible(true); });
  SignalBus.on('verberg_locatie', function() { setPlayerVisible(false); });
  SignalBus.on('speel_audio', function(p) { playAudioUrl(p.url); });
  SignalBus.on('toon_opdracht', function(p) { showOpdracht(p); });
  SignalBus.on('route_bijgewerkt', function() { loadActiveRoute().catch(function(){}); });
  SignalBus.on('toon_route', function() {
    settings.toonRoute = true;
    drawRoute();
  });
  SignalBus.on('verberg_route', function() {
    settings.toonRoute = false;
    drawRoute();
  });
  SignalBus.on('instellingen_bijgewerkt', function() {
    SettingsStore.load().then(function() { loadSettings(); drawRoute(); });
  });
  SignalBus.on('centreer_kaart', function(p) {
    if (map && p && p.lat && p.lon) map.flyTo({ center: [p.lon, p.lat], zoom: p.zoom || 12 });
  });
}

async function syncLoop() {
  try { await loadPendingOpdrachten(); } catch(e){}
}

async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    var wl = await navigator.wakeLock.request('screen');
    document.addEventListener('visibilitychange', async function() {
      if (document.visibilityState === 'visible') {
        try { wl = await navigator.wakeLock.request('screen'); } catch(e){}
      }
    });
  } catch(e){}
}
</script>
